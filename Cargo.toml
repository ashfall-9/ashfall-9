[workspace]
members = [
    ".",
    "crates/ashfall-core",
    "crates/ashfall-rendering",
    "crates/ashfall-physics",
    "crates/ashfall-materials",
    "crates/ashfall-human",
    "crates/ashfall-ai",
    "crates/ashfall-voice",
    "crates/ashfall-worldgen",
    "crates/ashfall-tools",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[package]
name = "ashfall"
version.workspace = true
edition.workspace = true

[lib]
name = "ashfall"
path = "src/lib.rs"

[[bin]]
name = "ashfall"
path = "src/main.rs"

[dependencies]
ashfall-ai = { path = "crates/ashfall-ai" }
ashfall-core = { path = "crates/ashfall-core" }
ashfall-human = { path = "crates/ashfall-human" }
ashfall-materials = { path = "crates/ashfall-materials" }
ashfall-physics = { path = "crates/ashfall-physics" }
ashfall-rendering = { path = "crates/ashfall-rendering" }
ashfall-tools = { path = "crates/ashfall-tools" }
ashfall-voice = { path = "crates/ashfall-voice" }
ashfall-worldgen = { path = "crates/ashfall-worldgen" }
